app:
  name: call-assistant
  environment: local
paths:
  incoming_folder: ./data/incoming
  archive_root: /home/garik/CallAssistantData/calls
  sqlite_path: ./data/index/call_assistant.db
  logs_dir: ./data/logs
  temp_dir: ./data/temp
ingest:
  supported_extensions:
  - .wav
  - .mp3
  - .m4a
  - .aac
  - .flac
  - .ogg
  - .wma
  stability_check_seconds: 2
  stability_poll_interval_seconds: 1
  file_hash_algorithm: sha256
  scan_interval_seconds: 5
queue:
  worker_count: 1
  stale_job_seconds: 300
  transcription_stale_multiplier: 3
  transcription_stale_buffer_seconds: 600
  transcription_stale_min_seconds: 1800
  retry_limits:
    import: 2
    audio_prepare: 2
    transcription: 2
    diarization: 2
    transcript_clean: 2
    analysis: 2
    indexing: 2
processing:
  startup_mode: manual_step
transcription:
  backend: whisper_legacy
  fallback_backend: whisper_legacy
  backend_legacy_enabled: true
  provider_default: local
  provider_fallback: cloud
  local_model: large-v3-turbo
  local_device: auto
  faster_whisper_compute_type: auto
  cloud_enabled: true
  cloud_model: whisper-1
  language_hints:
  - ru
  - he
  - en
  language_mode: auto
  force_language_for_single_language_calls: false
  mixed_language_triggers:
  - he
  - ru
  quality_retry_enabled: true
  quality_redundant_llm_enabled: true
  quality_redundant_llm_model: gpt-4.1-nano
  quality_redundant_llm_timeout_sec: 20
  quality_redundant_llm_max_chars: 1200
  quality_redundant_llm_continue_on_error: true
  retry_languages_on_suspicion:
  - he
  suspicious_short_call_seconds: 20
  suspicious_medium_call_seconds: 30
  candidate_merge_enabled: true
  vad_enabled: false
  vad_provider: silence
  vad_min_speech_ms: 250
  vad_min_silence_ms: 300
  vad_max_chunk_sec: 20
  vad_merge_gap_ms: 250
  vad_min_chunk_ms: 500
  language_smoothing_enabled: true
  language_smoothing_window: 1
  language_smoothing_min_confidence: 0.6
  language_smoothing_short_segment_sec: 2.5
  chunked_plausibility_enabled: true
  chunked_plausibility_min_score: 0.45
  chunked_short_call_seconds: 15
  chunked_max_distinct_languages_short_call: 2
  chunked_tiny_chunk_seconds: 1.2
  chunked_max_language_switch_ratio: 0.5
  chunked_auto_fallback_to_legacy: true
  chunked_repetition_penalty: 0.2
  chunked_repetition_threshold: 0.5
  chunked_coverage_tokens:
  - שלום
  - הלו
  - ברוך
  - יום
  chunked_coverage_penalty: 0.25
  chunked_diversity_min_unique_tokens: 6
  chunked_diversity_penalty: 0.15
  chunked_greeting_bonus: 0.1
  language_retry_enabled: true
  language_retry_order:
  - he
  - ru
  language_retry_confidence_threshold: 0.6
  language_retry_uncertain_segment_ratio: 0.5
segment_detection:
  enabled: false
  provider: openai
  model: gpt-4.1-mini
  run_on_every_call: true
  timeout_sec: 45
  max_retries: 2
  max_segments_per_call: 200
  context_window_segments: 2
  max_retry_segments_per_call: 10
  retry_language: he
  min_confidence_to_retry: 0.0
  continue_on_error: true
  extraction_mode: word_span
  max_candidate_spans_per_segment: 12
  min_span_words: 1
  max_span_words: 3
  audio_span_padding_sec: 0.35
  semantic_validation_enabled: true
  semantic_validation_model: gpt-4.1-mini
  semantic_validation_timeout_sec: 45
  semantic_min_confidence_to_accept: 0.75
  segment_reconciliation_enabled: true
  segment_reconciliation_model: gpt-4.1-mini
  clause_retry_enabled: true
  clause_retry_min_span_words: 4
  clause_retry_max_span_words: 8
  clause_retry_audio_padding_sec: 0.65
  clause_retry_max_per_call: 6
  full_call_hebrew_score_threshold: 0.45
  full_call_hebrew_min_suspicious_segments: 3
  full_call_hebrew_suspicious_ratio_threshold: 0.5
diarization:
  provider: pyannote
  enabled: true
  fallback_single_speaker: true
  confidence_default: medium
speaker_identity:
  enabled: true
  provider: pyannote
  auto_assign_threshold: 0.75
  suggest_threshold: 0.6
  min_cluster_duration_seconds: 6
  max_segments_per_cluster: 20
  continue_on_error: true
analysis:
  enabled: true
  provider: openai
  model: gpt-4o-mini
  summary_language: en
  timeout_sec: 90
  max_retries: 2
ui:
  host: 127.0.0.1
  port: 8081
logging:
  level: INFO
audio_processing:
  target_sample_rate: 16000
  target_db: -3.0
  high_pass_hz: 120.0
  low_pass_hz: 9000.0
  silence_pad_ms: 0
  temp_subdir: ./audio_processing
