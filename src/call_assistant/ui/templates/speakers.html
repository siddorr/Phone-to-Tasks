<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Speakers</title>
    <style>
      body { font-family: Georgia, serif; margin: 2rem auto; max-width: 1100px; background: #fcf8f1; color: #1e1f1a; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { padding: 0.75rem; border-bottom: 1px solid #ddd4c7; text-align: left; }
      a { color: #234f3d; text-decoration: none; }
    </style>
  </head>
  <body>
    <p><a href="/calls">Back to calls</a></p>
    <h1>Speakers</h1>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th>Linked Calls</th>
          <th>Last Seen</th>
        </tr>
      </thead>
      <tbody>
        {% for profile in profiles %}
        <tr>
          <td><a href="/speakers/{{ profile.speaker_identity_id }}">{{ profile.display_name }}</a></td>
          <td>{{ profile.status }}</td>
          <td>{{ profile.linked_calls }}</td>
          <td>{{ profile.last_seen or '-' }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4">No speaker profiles yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
