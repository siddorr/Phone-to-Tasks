<script>
(() => {
  const root = document.getElementById("app-status-line");
  if (!root) return;

  const pollIntervalSeconds = Number(root.dataset.pollInterval || "5");
  const statusUrl = root.dataset.statusUrl;
  if (!statusUrl) return;
  const staleAfterMs = 15000;
  let lastPayload = null;
  let lastSuccessAtMs = 0;
  let lastFailureCount = 0;

  const setText = (id, value) => {
    const node = document.getElementById(id);
    if (node) node.textContent = value;
  };

  const setVisible = (id, visible) => {
    const node = document.getElementById(id);
    if (node) node.style.display = visible ? "" : "none";
  };

  const formatDuration = (totalSeconds) => {
    if (totalSeconds == null || !Number.isFinite(totalSeconds)) return "-";
    const rounded = Math.max(0, Math.round(totalSeconds));
    const hours = Math.floor(rounded / 3600);
    const minutes = Math.floor((rounded % 3600) / 60);
    const seconds = rounded % 60;
    if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  };

  const formatLocalTimestamp = (isoString) => {
    if (!isoString) return "-";
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return "-";
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const seconds = String(date.getSeconds()).padStart(2, "0");
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
  };

  const formatEtaDisplay = (estimatedFinishAt, remainingSeconds, etaStatus) => {
    if (!estimatedFinishAt) return "unknown";
    if (etaStatus === "recalculating") {
      return `${formatLocalTimestamp(estimatedFinishAt)} (recalculating, about ${formatDuration(remainingSeconds)} left)`;
    }
    return `${formatLocalTimestamp(estimatedFinishAt)} (about ${formatDuration(remainingSeconds)} left)`;
  };

  const formatProgress = (progressPercent) => {
    if (progressPercent == null || !Number.isFinite(progressPercent)) return "-";
    return `${progressPercent.toFixed(1)}%`;
  };

  const formatStepName = (stepName) => {
    if (!stepName) return "-";
    return String(stepName).replace(/_/g, " ");
  };

  const recalcWindowSeconds = (referenceSeconds) => {
    const safeReference = Number.isFinite(referenceSeconds) ? referenceSeconds : 0;
    return Math.max(15, Math.min(300, safeReference * 0.2));
  };

  const recalculatedRemainingSeconds = (estimatedTotalSeconds, elapsedSeconds) => {
    const safeEstimated = Number.isFinite(estimatedTotalSeconds) ? estimatedTotalSeconds : 0;
    const safeElapsed = Number.isFinite(elapsedSeconds) ? elapsedSeconds : 0;
    const referenceSeconds = Math.max(safeEstimated, safeElapsed);
    return recalcWindowSeconds(referenceSeconds);
  };

  const updateLiveNote = () => {
    const isDelayed = !lastSuccessAtMs || (Date.now() - lastSuccessAtMs > staleAfterMs) || lastFailureCount >= 3;
    setVisible("status-live-note-group", isDelayed);
    if (isDelayed) setText("status-live-note", "live status delayed");
  };

  const render = (payload) => {
    root.className = `status-line status-line--${String(payload.app_status).replace(/\s+/g, "-")}`;
    setText("status-app-status", payload.app_status);
    setText("status-processing-mode", payload.processing_mode);
    setText("status-running-count", String(payload.counts.running));
    setText("status-queued-count", String(payload.counts.queued));
    setText("status-failed-count", String(payload.counts.failed));

    const task = payload.current_task;
    if (!task) {
      setText("status-current-task", "No task running");
      setVisible("status-current-call-group", false);
      setVisible("status-started-group", false);
      setVisible("status-elapsed-group", false);
      setVisible("status-progress-group", false);
      setVisible("status-substage-group", false);
      setVisible("status-eta-group", false);
      updateLiveNote();
      return;
    }

    setText("status-current-task", task.stage);
    const callLink = document.getElementById("status-current-call-link");
    if (callLink) {
      callLink.textContent = task.call_id;
      callLink.setAttribute("href", task.call_url);
    }
    setText("status-started-at", task.started_at_display);
    setText("status-elapsed", task.elapsed_display);
    setText("status-progress", formatProgress(Number(task.progress_percent)));
    setText("status-substage", formatStepName(task.progress_step_display));
    setText("status-eta", task.estimated_finish_display);
    setVisible("status-current-call-group", true);
    setVisible("status-started-group", true);
    setVisible("status-elapsed-group", true);
    setVisible("status-progress-group", true);
    setVisible("status-substage-group", true);
    setVisible("status-eta-group", true);
    updateLiveNote();
  };

  const tick = () => {
    if (!lastPayload) {
      updateLiveNote();
      return;
    }
    const task = lastPayload.current_task;
    if (!task || !task.started_at) {
      updateLiveNote();
      return;
    }

    const startedAt = new Date(task.started_at);
    if (Number.isNaN(startedAt.getTime())) {
      updateLiveNote();
      return;
    }

    const now = new Date();
    const elapsedSeconds = Math.max(0, Math.round((now.getTime() - startedAt.getTime()) / 1000));
    setText("status-elapsed", formatDuration(elapsedSeconds));

    const progressCompleted = Number(task.progress_completed);
    const progressTotal = Number(task.progress_total);
    const hasProgress = Number.isFinite(progressCompleted) && Number.isFinite(progressTotal) && progressTotal > 0;
    let progressPercent = Number(task.progress_percent);
    if (hasProgress) {
      progressPercent = Math.max(0, Math.min(100, (progressCompleted / progressTotal) * 100));
      setText("status-progress", formatProgress(progressPercent));
    }
    setText("status-substage", formatStepName(task.progress_step_display));

    if (task.estimated_finish_at) {
      let estimatedFinishAt = task.estimated_finish_at;
      let remainingSeconds;
      let etaStatus = task.eta_status;

      if (hasProgress && progressCompleted > 0 && progressCompleted < progressTotal) {
        const progressFraction = progressCompleted / progressTotal;
        const estimatedTotalSeconds = elapsedSeconds / progressFraction;
        remainingSeconds = Math.max(0, Math.round(estimatedTotalSeconds - elapsedSeconds));
        estimatedFinishAt = new Date(now.getTime() + remainingSeconds * 1000).toISOString();
        etaStatus = "progress";
      } else if (etaStatus === "recalculating") {
        remainingSeconds = recalculatedRemainingSeconds(Number(task.estimated_total_seconds), elapsedSeconds);
        estimatedFinishAt = new Date(now.getTime() + remainingSeconds * 1000).toISOString();
      } else {
        const etaDate = new Date(task.estimated_finish_at);
        if (!Number.isNaN(etaDate.getTime())) {
          remainingSeconds = Math.max(0, Math.round((etaDate.getTime() - now.getTime()) / 1000));
        }
      }

      setText("status-eta", formatEtaDisplay(estimatedFinishAt, remainingSeconds, etaStatus));
    }

    updateLiveNote();
  };

  const refresh = async () => {
    try {
      const response = await fetch(statusUrl, { headers: { "Accept": "application/json" } });
      if (!response.ok) {
        lastFailureCount += 1;
        updateLiveNote();
        return;
      }
      const payload = await response.json();
      lastPayload = payload;
      lastSuccessAtMs = Date.now();
      lastFailureCount = 0;
      render(payload);
    } catch (_error) {
      lastFailureCount += 1;
      updateLiveNote();
    }
  };

  refresh();
  window.setInterval(refresh, pollIntervalSeconds * 1000);
  window.setInterval(tick, 1000);
})();
</script>
